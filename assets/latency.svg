<svg xmlns="http://www.w3.org/2000/svg" width="700" height="170" viewBox="0 0 700 170" role="img" aria-label="Average response time before 27 to 32 seconds, after 6 to 10 seconds">
  <defs>
    <linearGradient id="before" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .t { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e2e8f0; }
      .v { font: 700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .h { font: 500 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
      .bar1 { transform-origin: 0 0; transform-box: fill-box; animation: grow1 1.4s ease-out both; }
      .bar2 { transform-origin: 0 0; transform-box: fill-box; animation: grow2 1.4s ease-out 1.6s both; }
      .val2 { animation: show 0.4s ease-out 2.6s both; }
      @keyframes grow1 { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes grow2 { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes show  { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>
  <rect width="700" height="170" rx="14" fill="#0f172a"/>
  <text x="24" y="30" class="h">Average AI response time, COROS retrieval pipeline</text>

  <text x="24" y="70" class="t">Before</text>
  <rect x="100" y="54" width="520" height="22" rx="11" fill="#1e293b"/>
  <rect class="bar1" x="100" y="54" width="520" height="22" rx="11" fill="url(#before)"/>
  <text x="532" y="70" class="v">27–32 s</text>

  <text x="24" y="120" class="t">After</text>
  <rect x="100" y="104" width="520" height="22" rx="11" fill="#1e293b"/>
  <rect class="bar2" x="100" y="104" width="166" height="22" rx="11" fill="url(#after)"/>
  <text x="278" y="120" class="v val2">6–10 s</text>
</svg>
